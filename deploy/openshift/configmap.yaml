apiVersion: v1
kind: ConfigMap
metadata:
  name: order-intake-config
  namespace: order-intake-pov
  labels:
    app.kubernetes.io/name: order-intake
data:
  APP_ENV: "openshift-pov"
  LOG_LEVEL: "INFO"
  PORT: "8080"
  # PoV-only local SQLite. Not a shared/HA database.
  DATABASE_URL: "sqlite:////app/data/orders.db"
